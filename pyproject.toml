[project]
name = "ckanext-feather-ui"
version = "0.0.1"
description = "Lightweight, CSS-variable driven CKAN theme built on Tailwind CSS and daisyUI"
readme = "README.md"
authors = [
    {name = "Oleksandr Cherniavskiy", email = "mutantsan@gmail.com"}
]
license = {text = "AGPL"}
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

keywords = [ "CKAN", "CSS", "theme", "tailwind", "daisyui", ]
dependencies = ["ckanext-theming>=0.0.6"]

[project.optional-dependencies]
dev = ["pytest-ckan"]

[project.urls]
Homepage = "https://github.com/DataShades/ckanext-feather-ui"

[project.entry-points."ckan.plugins"]
feather_ui = "ckanext.feather_ui.plugin:FeatherUiPlugin"


[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
filterwarnings = [
        "ignore::sqlalchemy.exc.SADeprecationWarning",
        "ignore::sqlalchemy.exc.SAWarning",
        "ignore::DeprecationWarning",
]
addopts = "--ckan-ini test.ini"

[tool.ruff]
line-length = 127

[tool.ruff.lint]
select = ["E", "F", "W"]

