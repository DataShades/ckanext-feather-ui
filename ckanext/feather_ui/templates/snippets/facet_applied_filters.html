<!-- Active Filters Block -->
<div class="w-80 bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-lg p-4">
    <div class="flex items-center justify-between mb-4">
        <h3 class="text-sm font-medium text-gray-700 dark:text-gray-300">Active Filters</h3>
        <button class="text-xs text-blue-600 dark:text-blue-400 hover:text-blue-800 dark:hover:text-blue-300">
            Clear all
        </button>
    </div>

    <!-- Grouped Active Filters -->
    <div class="space-y-3">
        <!-- Category Group -->
        <div>
            <div class="text-xs font-medium text-gray-500 dark:text-gray-400 mb-1.5">Category</div>
            <div class="flex flex-wrap gap-1.5">
                <span
                    class="inline-flex items-center gap-1 px-2.5 py-1 bg-emerald-100 dark:bg-emerald-900 text-emerald-800 dark:text-emerald-200 text-xs rounded-full">
                    Government
                    <button class="ml-0.5 hover:text-emerald-900 dark:hover:text-emerald-100">
                        <i data-lucide="x" class="w-3 h-3"></i>
                    </button>
                </span>

                <span
                    class="inline-flex items-center gap-1 px-2.5 py-1 bg-emerald-100 dark:bg-emerald-900 text-emerald-800 dark:text-emerald-200 text-xs rounded-full">
                    Health
                    <button class="ml-0.5 hover:text-emerald-900 dark:hover:text-emerald-100">
                        <i data-lucide="x" class="w-3 h-3"></i>
                    </button>
                </span>
            </div>
        </div>

        <!-- Format Group -->
        <div>
            <div class="text-xs font-medium text-gray-500 dark:text-gray-400 mb-1.5">Format</div>
            <div class="flex flex-wrap gap-1.5">
                <span
                    class="inline-flex items-center gap-1 px-2.5 py-1 bg-purple-100 dark:bg-purple-900 text-purple-800 dark:text-purple-200 text-xs rounded-full">
                    CSV
                    <button class="ml-0.5 hover:text-purple-900 dark:hover:text-purple-100">
                        <i data-lucide="x" class="w-3 h-3"></i>
                    </button>
                </span>

                <span
                    class="inline-flex items-center gap-1 px-2.5 py-1 bg-purple-100 dark:bg-purple-900 text-purple-800 dark:text-purple-200 text-xs rounded-full">
                    JSON
                    <button class="ml-0.5 hover:text-purple-900 dark:hover:text-purple-100">
                        <i data-lucide="x" class="w-3 h-3"></i>
                    </button>
                </span>
            </div>
        </div>

        <!-- Organization Group -->
        <div>
            <div class="text-xs font-medium text-gray-500 dark:text-gray-400 mb-1.5">Organization</div>
            <div class="flex flex-wrap gap-1.5">
                <span
                    class="inline-flex items-center gap-1 px-2.5 py-1 bg-orange-100 dark:bg-orange-900 text-orange-800 dark:text-orange-200 text-xs rounded-full">
                    City Hall
                    <button class="ml-0.5 hover:text-orange-900 dark:hover:text-orange-100">
                        <i data-lucide="x" class="w-3 h-3"></i>
                    </button>
                </span>
            </div>
        </div>

        <!-- Tags Group -->
        <div>
            <div class="text-xs font-medium text-gray-500 dark:text-gray-400 mb-1.5">Tags</div>
            <div class="flex flex-wrap gap-1.5">
                <span
                    class="inline-flex items-center gap-1 px-2.5 py-1 bg-cyan-100 dark:bg-cyan-900 text-cyan-800 dark:text-cyan-200 text-xs rounded-full">
                    Open Data
                    <button class="ml-0.5 hover:text-cyan-900 dark:hover:text-cyan-100">
                        <i data-lucide="x" class="w-3 h-3"></i>
                    </button>
                </span>

                <span
                    class="inline-flex items-center gap-1 px-2.5 py-1 bg-cyan-100 dark:bg-cyan-900 text-cyan-800 dark:text-cyan-200 text-xs rounded-full">
                    Real-time
                    <button class="ml-0.5 hover:text-cyan-900 dark:hover:text-cyan-100">
                        <i data-lucide="x" class="w-3 h-3"></i>
                    </button>
                </span>
            </div>
        </div>
    </div>
</div>
