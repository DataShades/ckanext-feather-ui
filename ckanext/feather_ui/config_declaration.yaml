version: 1
groups:
  - annotation: Feather UI
    options:
      - key: ckanext.feather_ui.newsletter_url
        default: ""
        example: https://example.com/subscribe
        description: |
          Form action of the "Subscribe to newsletter" block on the home page.
          The form sends an `email` field. The block is hidden when empty.

      - key: ckanext.feather_ui.home_cache_ttl
        type: int
        default: 300
        description: |
          Seconds to cache the data of the home page (counts, categories,
          popular tags, featured datasets) in Redis. Set to 0 to disable
          caching.

      - key: ckanext.feather_ui.social.github
        default: ""
        example: https://github.com/ckan
        description: URL of the GitHub icon in the footer. The icon is hidden when empty.

      - key: ckanext.feather_ui.social.youtube
        default: ""
        description: URL of the YouTube icon in the footer. The icon is hidden when empty.

      - key: ckanext.feather_ui.social.linkedin
        default: ""
        description: URL of the LinkedIn icon in the footer. The icon is hidden when empty.

      - key: ckanext.feather_ui.footer.accessibility
        default: ""
        description: URL of the "Accessibility" footer link. The link is hidden when empty.

      - key: ckanext.feather_ui.footer.contact
        default: ""
        description: URL of the "Contact" footer link. The link is hidden when empty.

      - key: ckanext.feather_ui.footer.jobs
        default: ""
        description: URL of the "Jobs" footer link. The link is hidden when empty.

      - key: ckanext.feather_ui.footer.press_kit
        default: ""
        description: URL of the "Press kit" footer link. The link is hidden when empty.

      - key: ckanext.feather_ui.footer.terms
        default: ""
        description: URL of the "Term of use" footer link. The link is hidden when empty.

      - key: ckanext.feather_ui.footer.privacy
        default: ""
        description: URL of the "Privacy policy" footer link. The link is hidden when empty.

      - key: ckanext.feather_ui.footer.cookies
        default: ""
        description: URL of the "Cookie policy" footer link. The link is hidden when empty.
