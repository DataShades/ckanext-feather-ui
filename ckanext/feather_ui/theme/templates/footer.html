{%- call ui.util.call(ui.footer) %}
    <div class="flex flex-col gap-8 md:flex-row md:justify-between">
        {%- call ui.util.call(ui.footer_main) -%}
            <p class="text-lg font-semibold">{{ g.site_title }}</p>
            <p class="opacity-80">{{ g.site_description }}</p>
        {%- endcall %}
        {%- call ui.util.call(ui.footer_secondary) -%}
            {{ ui.language_selector() }}
        {%- endcall %}
    </div>
    <p class="mt-8 border-t border-current/15 pt-4 text-sm opacity-70">
        {{ _("Powered by") }} <a class="text-current" href="https://ckan.org" target="_blank" rel="noopener">CKAN</a>
    </p>
{%- endcall %}
